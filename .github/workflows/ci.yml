# SPDX-License-Identifier: 0BSD

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} / ${{ matrix.json }} JSON
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        json: [system, bundled]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build nlohmann-json3-dev

      - name: Select compiler
        run: |
          if [[ "${{ matrix.compiler }}" == "gcc" ]]; then
            echo "CXX=g++" >> "$GITHUB_ENV"
          else
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi

      - name: Select JSON dependency
        run: |
          if [[ "${{ matrix.json }}" == "bundled" ]]; then
            echo "USE_BUNDLED_JSON=ON" >> "$GITHUB_ENV"
          else
            echo "USE_BUNDLED_JSON=OFF" >> "$GITHUB_ENV"
          fi

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Wconversion -Wsign-conversion -Werror" \
            -DCXX_MODGRAPH_USE_BUNDLED_NLOHMANN_JSON="$USE_BUNDLED_JSON" \
            -DCXX_MODGRAPH_BUILD_HOST_INTEGRATION_TESTS=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  formatting:
    name: Formatting and data files
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format jq

      - name: Check C++ formatting
        shell: bash
        run: |
          mapfile -t sources < <(
            git ls-files \
              '*.cpp' '*.hpp' '*.cppm' \
              ':!vendor/**'
          )
          clang-format --dry-run --Werror "${sources[@]}"

      - name: Validate JSON files
        shell: bash
        run: |
          mapfile -t documents < <(
            git ls-files '*.json' '*.json.in'
          )
          jq empty "${documents[@]}"

      - name: Check whitespace
        run: git show --check --format= --no-renames HEAD

  mingw64-cross-compilation:
    name: MinGW-w64 cross-compilation / Make and Ninja
    runs-on: ubuntu-24.04
    container: fedora:44

    steps:
      - name: Install build and cross-compilation dependencies
        run: >-
          dnf install --assumeyes
          cmake gcc-c++ git-core make mingw64-gcc-c++ ninja-build

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCXX_MODGRAPH_USE_BUNDLED_NLOHMANN_JSON=ON
          -DCXX_MODGRAPH_BUILD_TESTS=OFF

      - name: Build cxx-modgraph for the host
        run: cmake --build build --parallel

      - name: Cross-compile modules with Make and Ninja
        run: >-
          cmake
          -Dmake_program=/usr/bin/make
          -Dninja_program=/usr/bin/ninja
          -Dmodgraph=$PWD/build/cxx-modgraph
          -Dsource_root=$PWD
          -Dwork_directory=$PWD/build/mingw64-smoke
          -Dcross_cxx=x86_64-w64-mingw32-g++
          -P tests/cross/mingw64_smoke.cmake
